<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  #wrap {
    position: relative;
    width: 100%;
    border-radius: 10px;
    overflow: hidden;
    /* Purple "atmospheric glow" around the map, in keeping with the
       app's amethyst theme - our own CSS, not GeoLibre's internals. */
    box-shadow: 0 0 0 1px rgba(139, 92, 246, 0.25),
                0 0 40px 6px rgba(139, 92, 246, 0.18),
                0 0 90px 20px rgba(91, 33, 182, 0.12);
  }
  #geolibre-frame { width: 100%; border: 0; display: block; }
  #sync-badge {
    position: absolute; top: 8px; right: 8px; z-index: 10;
    font: 11px/1.4 -apple-system, sans-serif; padding: 3px 8px;
    border-radius: 4px; background: rgba(24,12,36,0.85); color: #D8C9F5;
    border: 1px solid rgba(139, 92, 246, 0.35); pointer-events: none; opacity: 0;
    transition: opacity 0.2s ease;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="sync-badge"></div>
  <iframe id="geolibre-frame" allow="clipboard-write"></iframe>
</div>
<script>
let _renderedOnce = false;
let _lastArgs = null;

function stSend(type, extra) {
  window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type }, extra || {}), "*");
}

function setFrameHeight(px) {
  stSend("streamlit:setFrameHeight", { height: px });
}

function showBadge(text, ms) {
  const el = document.getElementById("sync-badge");
  el.textContent = text;
  el.style.opacity = "1";
  clearTimeout(showBadge._t);
  showBadge._t = setTimeout(() => { el.style.opacity = "0"; }, ms || 1800);
}

function withCacheBuster(url) {
  // GeoLibre's own docs name stale-cache version skew as the top cause
  // of init-time crashes - bust the top-level document request so a
  // stale cached shell can never linger for the session.
  const bust = (url.includes("?") ? "&" : "?") + "_cb=" + Date.now();
  return url + bust;
}

function loadIframe(iframeEl, geolibreUrl, badgeText) {
  iframeEl.src = withCacheBuster(geolibreUrl);
  if (badgeText) showBadge(badgeText, 2000);
}

async function onRender(event) {
  const args = event.detail.args;
  const iframeEl = document.getElementById("geolibre-frame");

  setFrameHeight(args.height || 820);

  const structuralChanged = !_lastArgs || _lastArgs.structuralVersion !== args.structuralVersion;
  const urlChanged = !_lastArgs || _lastArgs.geolibreUrl !== args.geolibreUrl;

  if (!_renderedOnce) {
    _renderedOnce = true;
    iframeEl.style.height = (args.height || 820) + "px";
    loadIframe(iframeEl, args.geolibreUrl);
    _lastArgs = args;
    return;
  }

  if (structuralChanged || urlChanged) {
    loadIframe(iframeEl, args.geolibreUrl, "Loading map…");
    _lastArgs = args;
    return;
  }

  // Neither changed - a Streamlit rerun triggered by something else on
  // the page. Do nothing, so the map never visibly reloads for that.
  _lastArgs = args;
}

window.addEventListener("message", (event) => {
  const data = event.data;
  if (!data || data.type !== "streamlit:render") return;
  onRender({ detail: { args: data.args } });
});

stSend("streamlit:componentReady", { apiVersion: 1 });
setFrameHeight(820);
</script>
</body>
</html>
